name: coverage

on:
  push:
    branches: [3.x, 4.x, 5.x]
  pull_request:
    branches: [3.x, 4.x, 5.x]

permissions:
  # write: the badge step pushes coverage.json to the badges branch
  contents: write
  pull-requests: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    name: Code coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: pcov

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Run tests with coverage
        run: |
          set -o pipefail
          vendor/bin/pest --ci --coverage --parallel --colors=never | tee build-output.txt

      - name: Write coverage summary
        if: always()
        run: |
          {
            echo '## Code coverage'
            echo
            echo 'Uncovered line ranges are listed next to each file.'
            echo
            echo '```'
            sed -n '/Random Order Seed/,$p' build-output.txt | tail -n +2 | sed '/^[[:space:]]*$/d'
            echo '```'
          } > coverage-summary.md
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage
          path: coverage-summary.md

      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          percent=$(php -r '$m = simplexml_load_file("build/logs/clover.xml")->project->metrics; printf("%.1f", $m["coveredstatements"] / max(1, (int) $m["statements"]) * 100);')
          color=$(php -r '$p = (float) $argv[1]; echo match (true) { $p >= 90 => "brightgreen", $p >= 75 => "green", $p >= 60 => "yellow", $p >= 40 => "orange", default => "red" };' "$percent")

          mkdir badges && cd badges
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth=1 origin badges; then git checkout -q -B badges FETCH_HEAD; else git checkout -q --orphan badges; fi

          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${percent}%\",\"color\":\"${color}\"}" > coverage.json
          git add coverage.json
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "Coverage ${percent}%"
          git push -q origin badges

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            build/coverage
            build/logs/clover.xml
