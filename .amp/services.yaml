services:
  demo:
    cwd: ../repos/socialment-demo
    command: >-
      php artisan optimize:clear &&
      APP_URL="$PUBLIC_URL" ASSET_URL="$PUBLIC_URL" php artisan serve --host=0.0.0.0 --port="$PORT"
    health: /up
    portal:
      url: /admin
      title: Socialment Demo
      description: Sign in as test@example.com / password.
  demo-assets:
    cwd: ../repos/socialment-demo
    command: npx vite build --watch
